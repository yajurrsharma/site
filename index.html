<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>terminal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grain-overlay"></div>

    <div id="preloader">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <div id="loader-status">INITIALIZING.</div>
            <div class="progress-bar"><div id="progress-fill"></div></div>
        </div>
    </div>

    <div class="terminal-wrapper hidden" id="terminal">
        <div class="terminal-header">
            <div class="window-title">KERNEL // v5.19.0</div>
        </div>

        <div class="terminal-body" id="terminal-body">
            <div id="output-history"></div>

            <div class="prompt-line hidden" id="prompt-line">
                <span class="prompt-user" id="prompt-user">user@terminal</span>:<span class="prompt-path" id="prompt-path">~</span><span class="prompt-sym">$</span>
                <div class="input-container">
                    <input type="text" id="cli-input" autocomplete="on" spellcheck="false" />
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
